workflows:
  ios-release:
    name: 旅コンプリ iOS リリースビルド
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: hana_apple_api
    environment:
      groups:
        - app_store_credentials   # CERTIFICATE_PRIVATE_KEY（Secret）を登録
      vars:
        BUNDLE_ID: "biz.trickster.hana.tabicompuri.app"
        APP_STORE_APP_ID: "6829718767"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: lts
      xcode: latest
      cocoapods: default
    triggering:
      events: [push]
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: npm install
        script: npm install
      - name: Capacitor sync（Webアセットをネイティブプロジェクトへ反映）
        script: npx cap sync ios
      - name: ビルド番号を自動インクリメント（App Store Connectの最新値+1）
        script: |
          cd ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number "$APP_STORE_APP_ID")
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: 署名用キーチェーンを初期化
        script: keychain initialize
      - name: 配布用証明書・プロビジョニングプロファイルを自動取得
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: 証明書をキーチェーンに追加
        script: keychain add-certificates
      - name: Xcodeの自動署名を設定
        script: xcode-project use-profiles
      - name: IPAをビルド
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false   # 内部グループは自動配信設定に任せる（beta_groupsに内部グループ名を
                                        # 入れるとエラーになるため指定しない。クレゲーでの既知の挙動）
